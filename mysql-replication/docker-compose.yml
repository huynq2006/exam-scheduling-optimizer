version: '3.8'

services:
  # Master Database Server
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    ports:
      - "13306:3306"
    env_file:
      - ../.env
    networks:
      - internal_db_net
    volumes:
      - ./master.cnf:/etc/mysql/conf.d/master.cnf
      - ../database:/docker-entrypoint-initdb.d
      - master-data:/var/lib/mysql

  # Slave Database Server
  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    ports:
      - "13307:3306"
    env_file:
      - ../.env
    depends_on:
      - mysql-master
    networks:
      - internal_db_net
    volumes:
      # Nạp cấu hình slave từ thư mục hiện tại
      - ./slave.cnf:/etc/mysql/conf.d/slave.cnf
      - slave-data:/var/lib/mysql

networks:
  internal_db_net:
    driver: bridge

volumes:
  master-data:
  slave-data: