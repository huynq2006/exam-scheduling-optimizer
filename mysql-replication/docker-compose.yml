version: '3.8'

services:
  # Master Database Server
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    ports:
      - "23306:3306"
    env_file:
      - ../.env
    networks:
      - internal_db_net
    volumes:
      - ./master.cnf:/etc/mysql/conf.d/master.cnf
      - ./entrypoint.sh:/usr/local/bin/fix-cnf-perms.sh:ro
      - ../database:/docker-entrypoint-initdb.d
      - master-data:/var/lib/mysql
    # File .cnf mount từ Windows là 777 nên MySQL bỏ qua; hạ quyền trước khi khởi động.
    entrypoint: ["/bin/bash", "/usr/local/bin/fix-cnf-perms.sh"]
    command: ["mysqld"]

  # Slave Database Server
  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    ports:
      - "23307:3306"
    env_file:
      - ../.env
    depends_on:
      - mysql-master
    networks:
      - internal_db_net
    volumes:
      # Nạp cấu hình slave từ thư mục hiện tại
      - ./slave.cnf:/etc/mysql/conf.d/slave.cnf
      - ./entrypoint.sh:/usr/local/bin/fix-cnf-perms.sh:ro
      - slave-data:/var/lib/mysql
    entrypoint: ["/bin/bash", "/usr/local/bin/fix-cnf-perms.sh"]
    command: ["mysqld"]

networks:
  internal_db_net:
    driver: bridge

volumes:
  master-data:
  slave-data:
